services:
  visionx-auth-service:
    build:
      context: ./VisionX.Auth
      dockerfile: Dockerfile
    container_name: visionx-auth-service
    env_file:
      - path: /opt/visionx/secrets/.env.auth
        required: false
      - path: ./.env
        required: false
      - path: ./.env.main
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-visionx-auth-service}
      Jwt__Audience: ${JWT_AUDIENCE:-visionx-app}
      Jwt__KeyId: ${JWT_KEY_ID:-visionx-auth-rs256-v1}
      Jwt__PrivateKeyPath: ${JWT_PRIVATE_KEY_PATH:-/run/secrets/jwt_private.pem}
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      App__Version: ${AUTH_APP_VERSION:-auth-dev}
      SessionEvents__Applications__0__Name: VisionXBackend
      SessionEvents__Applications__0__WebhookUrl: ${VISIONX_BACKEND_WEBHOOK_URL:-https://api.visionx.io/api/internal/auth/session-events}
      SessionEvents__Applications__0__Secret: ${SESSION_WEBHOOK_SECRET:-change-me-webhook-secret}
      SessionEvents__Applications__0__Enabled: "true"
    ports:
      - "${APP_PORT:-6509}:8080"
    volumes:
      - ${JWT_SECRETS_DIR:-/opt/visionx/secrets}:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/meta/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - visionx-auth-network

  postgres:
    image: postgres:16-alpine
    container_name: visionx-auth-postgres
    env_file:
      - path: /opt/visionx/secrets/.env.auth
        required: false
      - path: ./.env
        required: false
      - path: ./.env.main
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - visionx-auth-network

volumes:
  postgres_data:

networks:
  visionx-auth-network:
    driver: bridge
